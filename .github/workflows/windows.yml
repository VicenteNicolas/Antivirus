name: Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore SentinelSecurity.slnx --locked-mode
      - run: dotnet build SentinelSecurity.slnx --configuration Release --no-restore
      - run: dotnet test SentinelSecurity.slnx --configuration Release --no-build --logger "trx;LogFileName=sentinel.trx"
