name: Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore SentinelSecurity.slnx --locked-mode
      - run: dotnet build SentinelSecurity.slnx --configuration Release --no-restore
      - run: dotnet test SentinelSecurity.slnx --configuration Release --no-build --logger "trx;LogFileName=sentinel.trx"
      - run: ./scripts/publish.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: SentinelSecurity-win-x64
          path: |
            artifacts/SentinelSecurity-win-x64.zip
            artifacts/SentinelSecurity-win-x64.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resultados-de-pruebas
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: SentinelSecurity-win-x64
          path: distribution
      - name: Publicar versión experimental
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -cnotmatch '^v\d+\.\d+\.\d+$') { throw 'Etiqueta semántica no válida.' }
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag distribution/SentinelSecurity-win-x64.zip distribution/SentinelSecurity-win-x64.zip.sha256 --repo $env:GITHUB_REPOSITORY --verify-tag --prerelease --title "Sentinel Security $tag" --notes "Windows 11 x64 con .NET Desktop Runtime 10. Consulta el README para configurar los motores y conocer la cobertura."
          exit $LASTEXITCODE
